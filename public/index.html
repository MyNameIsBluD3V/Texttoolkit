
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Counter & Humanizer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-mode">
  <div class="container">
    <header>
      <h1>Word Counter & Humanizer</h1>
      <button id="theme-toggle" aria-label="Toggle dark/light mode">
        <i class="fas fa-moon"></i>
      </button>
    </header>
    
    <main>
      <div class="input-container">
        <textarea id="text-input" placeholder="Type or paste your text here..."></textarea>
      </div>
      
      <div class="stats-container">
        <div class="stat-box">
          <div class="stat-icon"><i class="fas fa-font"></i></div>
          <div class="stat-info">
            <h3>Characters</h3>
            <p id="char-count">0</p>
          </div>
        </div>
        
        <div class="stat-box">
          <div class="stat-icon"><i class="fas fa-paragraph"></i></div>
          <div class="stat-info">
            <h3>Words</h3>
            <p id="word-count">0</p>
          </div>
        </div>
        
        <div class="stat-box">
          <div class="stat-icon"><i class="fas fa-align-left"></i></div>
          <div class="stat-info">
            <h3>Sentences</h3>
            <p id="sentence-count">0</p>
          </div>
        </div>
        
        <div class="stat-box">
          <div class="stat-icon"><i class="fas fa-book"></i></div>
          <div class="stat-info">
            <h3>Paragraphs</h3>
            <p id="paragraph-count">0</p>
          </div>
        </div>
      </div>
      
      <div class="humanizer-container">
        <h2>Humanized Text</h2>
        <div id="humanized-text" class="humanized-output">Your humanized text will appear here</div>
      </div>
    </main>
    
    <footer>
      <p>Word Counter & Humanizer &copy; 2023</p>
    </footer>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
