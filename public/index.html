
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Toolkit</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="theme-toggle">
    <button id="themeToggle"><i class="fas fa-moon"></i></button>
  </div>
  
  <div class="container">
    <h1>Text Toolkit</h1>
    
    <div class="input-container">
      <textarea id="textInput" placeholder="Enter your text here..."></textarea>
      <div class="button-container">
        <button id="countBtn">Count Words</button>
        <button id="humanizeBtn">Humanize</button>
        <button id="paraphraseBtn">Paraphrase</button>
        <button id="detectAIBtn">AI Detector</button>
        <button id="summarizeBtn">Summarize</button>
        <button id="clearBtn">Clear</button>
      </div>
    </div>
    
    <div class="result-container">
      <div id="wordCountResult" class="result-box">
        <h2>Word Count</h2>
        <div id="countOutput" class="output"></div>
      </div>
      
      <div id="humanizedResult" class="result-box">
        <h2>Humanized Text</h2>
        <div id="humanizeOutput" class="output"></div>
      </div>
      
      <div id="paraphrasedResult" class="result-box">
        <h2>Paraphrased Text</h2>
        <div id="paraphraseOutput" class="output"></div>
      </div>
      
      <div id="aiDetectionResult" class="result-box">
        <h2>AI Detection</h2>
        <div id="aiDetectOutput" class="output"></div>
      </div>
      
      <div id="summarizedResult" class="result-box">
        <h2>Summarized Text</h2>
        <div id="summarizeOutput" class="output"></div>
      </div>
    </div>
  </div>
  
  <footer>
    <p>© Ajay Manaytay</p>
    <p><a href="https://www.facebook.com/profile.php?id=100085291853895" target="_blank" class="report-link">Report a Problem</a></p>
  </footer>
  
  <div class="stars"></div>
  <div class="twinkling"></div>
  
  <script src="script.js"></script>
</body>
</html>
